<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="redPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bluePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="yellowPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="greenPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle grid accent -->
  <circle cx="256" cy="256" r="210" stroke="#334155" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.4"/>

  <!-- Barbell Bar -->
  <g filter="url(#glow)">
    <!-- Central Knurled Bar -->
    <rect x="36" y="246" width="440" height="20" rx="10" fill="url(#steel)"/>
    <!-- Center knurling marks -->
    <line x1="230" y1="246" x2="230" y2="266" stroke="#334155" stroke-width="1.5"/>
    <line x1="256" y1="246" x2="256" y2="266" stroke="#334155" stroke-width="1.5"/>
    <line x1="282" y1="246" x2="282" y2="266" stroke="#334155" stroke-width="1.5"/>

    <!-- Left Sleeves & Collars -->
    <rect x="80" y="238" width="14" height="36" rx="4" fill="#94a3b8"/>
    <!-- Left Plates: Red 25kg, Blue 20kg, Yellow 15kg, Green 10kg -->
    <rect x="98" y="146" width="22" height="220" rx="6" fill="url(#redPlate)"/>
    <rect x="124" y="156" width="20" height="200" rx="6" fill="url(#bluePlate)"/>
    <rect x="148" y="170" width="18" height="172" rx="5" fill="url(#yellowPlate)"/>
    <rect x="170" y="186" width="16" height="140" rx="5" fill="url(#greenPlate)"/>
    <!-- Left Collar -->
    <rect x="190" y="240" width="12" height="32" rx="3" fill="#cbd5e1"/>

    <!-- Right Sleeves & Collars -->
    <rect x="418" y="238" width="14" height="36" rx="4" fill="#94a3b8"/>
    <!-- Right Plates -->
    <rect x="392" y="146" width="22" height="220" rx="6" fill="url(#redPlate)"/>
    <rect x="368" y="156" width="20" height="200" rx="6" fill="url(#bluePlate)"/>
    <rect x="346" y="170" width="18" height="172" rx="5" fill="url(#yellowPlate)"/>
    <rect x="326" y="186" width="16" height="140" rx="5" fill="url(#greenPlate)"/>
    <!-- Right Collar -->
    <rect x="310" y="240" width="12" height="32" rx="3" fill="#cbd5e1"/>

    <!-- Center Badge: PR Star / Trophy Icon -->
    <circle cx="256" cy="256" r="38" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <path d="M256 230 L263 245 L279 247 L267 259 L270 275 L256 267 L242 275 L245 259 L233 247 L249 245 Z" fill="#fbbf24"/>
  </g>

  <!-- Typography: KG & PR -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="4">BARBELL PR</text>
  <text x="256" y="452" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="2">OLYMPIC LOAD TRACKER</text>
</svg>
